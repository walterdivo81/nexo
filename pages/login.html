<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17141c">
  <title>Entrar | NEXO</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="../index.html">NE<span>X</span>O</a>
    <nav>
      <a href="../index.html">Início</a>
      <a href="cadastro.html">Criar conta</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="form card">
      <div class="eyebrow">Área do usuário</div>
      <h1>Entrar na sua conta</h1>
      <p class="muted">Informe seu e-mail e senha para acessar o portal NEXO.</p>
      
      <div class="field"><label>E-mail</label><input id="email" type="email" placeholder="voce@email.com"></div>
      <div class="field"><label>Senha</label><input id="senha" type="password" placeholder="Sua senha"></div>
      
      <button id="btn-entrar" class="btn">Entrar</button>
    </section>
  </main>

  <footer class="footer">NEXO • Serviço destinado exclusivamente a maiores de 18 anos.</footer>

  <script>
    const supabaseUrl = 'https://kprkwwyxrszwgwdpwwib.supabase.co';
    const supabaseKey = 'sb_publishable_MOz2LYPn8WkK81FgU9ED9Q_2ITbkBvP';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('btn-entrar').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      if (!email || !senha) {
        alert('Por favor, preencha o e-mail e a senha.');
        return;
      }

      // Consulta de login na tabela 'usuarios'
      const { data, error } = await _supabase
        .from('usuarios')
        .select('*')
        .eq('email', email)
        .eq('senha', senha)
        .single();

      if (error || !data) {
        alert('E-mail ou senha incorretos.');
      } else {
        // Armazena a sessão simples no localStorage
        localStorage.setItem('nexo_user', JSON.stringify(data));
        alert('Login realizado com sucesso no portal NEXO!');
        window.location.href = 'descobrir.html';
      }
    });
  </script>
</body>
</html>
